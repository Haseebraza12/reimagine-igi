<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>IGI HUD harness (dev)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        height: 100%;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #igi-ui {
        position: fixed;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        pointer-events: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #d8f0d8;
        font: 18px "Courier New", monospace;
        white-space: pre-line;
        background: rgba(0, 0, 0, 0.55);
      }
      #overlay.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Dev only: mounts src/engine/ui over a static background with simulated state (?scene=...). -->
    <canvas id="game"></canvas>
    <div id="hud">
      <canvas id="igi-ui" width="640" height="480"></canvas>
      <div id="overlay" class="hidden"></div>
    </div>
    <script type="module" src="./hud.ts"></script>
  </body>
</html>
