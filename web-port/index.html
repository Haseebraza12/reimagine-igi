<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Project I.G.I. — Trainyard (web port)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        height: 100%;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      /*
       * The original interface (HUD, radio messages, loading screen, menus) is
       * drawn by src/engine/ui into this 640x480 canvas, which is placed over
       * the 4:3 game frame (ctx.frame) and scaled with nearest-neighbour
       * sampling. Its pointer events are enabled only while a menu is open.
       */
      #igi-ui {
        position: fixed;
        left: 0;
        top: 0;
        width: 640px;
        height: 480px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        pointer-events: none;
        touch-action: none;
      }
      /* Port-level messages only (e.g. missing game files); not part of the original UI. */
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: "Courier New", monospace;
        font-size: 18px;
        line-height: 1.6;
        letter-spacing: 1px;
        text-align: center;
        white-space: pre-line;
        color: #d8f0d8;
        text-shadow: 0 0 4px #000;
        background: rgba(0, 0, 0, 0.55);
        pointer-events: none;
      }
      #overlay.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <canvas id="igi-ui" width="640" height="480"></canvas>
      <div id="overlay" class="hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
